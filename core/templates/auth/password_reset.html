{% load static %}
<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Recuperar Palavra-passe | Oficina Miadas</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Poppins:wght@300;500;700;800&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- CSS -->
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
    <style>
        .password-reset-container {
            max-width: 500px;
            margin: 0 auto;
        }
        
        .info-box {
            background: rgba(255, 149, 0, 0.1);
            border-left: 4px solid #ff9500;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.8);
        }
    </style>
</head>
<body>

    <!-- Background -->
    <div class="auth-bg">
        <div class="auth-overlay"></div>
    </div>

    <!-- Voltar -->
    <a href="/" class="back-home">
        <i class="fas fa-arrow-left"></i> Voltar ao Início
    </a>

    <!-- Container -->
    <div class="auth-container password-reset-container">
        <div class="auth-logo">
            <img src="{% static 'images/logo.png' %}" alt="Logo Oficina Miadas">
        </div>
        
        <h2>Recuperar Palavra-passe</h2>
        <p class="subtitle">Introduza o seu email para receber instruções de recuperação.</p>

        <!-- Info Box -->
        <div class="info-box">
            <i class="fas fa-info-circle"></i> Enviaremos um email com um link para redefinir a sua palavra-passe.
        </div>

        <!-- Formulário -->
        <form method="POST" class="auth-form">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="id_email">
                    <i class="fas fa-envelope"></i> Endereço de Email
                </label>
                <input 
                    type="email" 
                    name="email" 
                    id="id_email"
                    placeholder="seu.email@exemplo.com"
                    required
                    class="form-input"
                >
            </div>

            <button type="submit" class="btn-submit">
                Enviar Email <i class="fas fa-paper-plane"></i>
            </button>
        </form>

        <!-- Links -->
        <div class="auth-footer">
            <a href="{% url 'login' %}" style="color: #ff9500; text-decoration: none;">
                <i class="fas fa-arrow-left"></i> Voltar ao Login
            </a>
        </div>
    </div>

</body>
</html>
