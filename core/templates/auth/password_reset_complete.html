{% load static %}
<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Palavra-passe Redefinida | Oficina Miadas</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Poppins:wght@300;500;700;800&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- CSS -->
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
    <style>
        .success-container {
            max-width: 500px;
            margin: 0 auto;
            text-align: center;
        }
        
        .success-icon {
            font-size: 60px;
            color: #28a745;
            margin-bottom: 20px;
            animation: bounce 1s ease-in-out;
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
        
        .success-box {
            background: rgba(40, 167, 69, 0.1);
            border-left: 4px solid #28a745;
            padding: 20px;
            border-radius: 6px;
            margin: 20px 0;
        }
    </style>
</head>
<body>

    <!-- Background -->
    <div class="auth-bg">
        <div class="auth-overlay"></div>
    </div>

    <!-- Voltar -->
    <a href="/" class="back-home">
        <i class="fas fa-arrow-left"></i> Voltar ao Início
    </a>

    <!-- Container -->
    <div class="auth-container success-container">
        <div class="success-icon">
            <i class="fas fa-check-circle"></i>
        </div>
        
        <h2>Palavra-passe Redefinida!</h2>
        <p class="subtitle">A sua palavra-passe foi alterada com sucesso.</p>

        <!-- Success Box -->
        <div class="success-box">
            <i class="fas fa-check"></i> Pode agora fazer login com a sua nova palavra-passe.
        </div>

        <!-- Botões -->
        <div class="auth-footer" style="margin-top: 30px;">
            <a href="{% url 'login' %}" class="btn-submit" style="display: inline-block; text-decoration: none; margin-bottom: 10px;">
                Ir para Login <i class="fas fa-sign-in-alt"></i>
            </a>
            <br>
            <a href="/" style="color: #ff9500; text-decoration: none; font-size: 14px;">
                <i class="fas fa-home"></i> Ir para Home
            </a>
        </div>
    </div>

</body>
</html>
