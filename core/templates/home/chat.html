{% extends 'home/base_cliente.html' %}
{% load static %}

{% block title %}Chat - Oficina Miadas{% endblock %}

{% block content %}
<!-- ============================================================
     SEÇÃO: CHAT CLIENTE
     ============================================================ -->
<div class="container-chat-cliente">
    <div class="cabecalho-chat-cliente">
        <h2>Chat com Admin</h2>
        <p>{{ admin.first_name }}</p>
    </div>
    
    <div class="mensagens-container-cliente" id="mensagens-container">
        {% for msg in mensagens %}
            <div class="mensagem-cliente {% if msg.remetente == request.user %}enviada{% else %}recebida{% endif %}">
                <div class="conteudo-msg">{{ msg.conteudo }}</div>
                <div class="hora-msg">{{ msg.criada_em|date:"H:i" }}</div>
            </div>
        {% endfor %}
    </div>
    
    <form class="formulario-chat-cliente" id="formulario-chat-cliente">
        {% csrf_token %}
        <textarea name="conteudo" placeholder="Digite sua mensagem..." required></textarea>
        <button type="submit" class="btn-enviar-cliente">Enviar</button>
    </form>
</div>

<style>
.container-chat-cliente {
    max-width: 800px;
    margin: 30px auto;
    display: flex;
    flex-direction: column;
    height: 600px;
    border: 1px solid var(--borda);
    border-radius: 8px;
    overflow: hidden;
}

.cabecalho-chat-cliente {
    padding: 20px;
    background: var(--fundo-secundario);
    border-bottom: 1px solid var(--borda);
}

.mensagens-container-cliente {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
}

.mensagem-cliente {
    margin-bottom: 15px;
    display: flex;
    flex-direction: column;
}

.mensagem-cliente.enviada {
    align-items: flex-end;
}

.mensagem-cliente.recebida {
    align-items: flex-start;
}

.conteudo-msg {
    max-width: 70%;
    padding: 10px 15px;
    border-radius: 8px;
    background: var(--fundo-secundario);
    color: var(--texto);
}

.mensagem-cliente.enviada .conteudo-msg {
    background: #007bff;
    color: white;
}

.formulario-chat-cliente {
    display: flex;
    gap: 10px;
    padding: 20px;
    border-top: 1px solid var(--borda);
}

.formulario-chat-cliente textarea {
    flex: 1;
    padding: 10px;
    border: 1px solid var(--borda);
    border-radius: 8px;
    resize: none;
    height: 50px;
}

.btn-enviar-cliente {
    padding: 10px 20px;
    background: #007bff;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
}
</style>

<script>
// ============================================================
// SEÇÃO: JAVASCRIPT - CHAT CLIENTE
// ============================================================

document.getElementById('formulario-chat-cliente').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const formData = new FormData(this);
    
    fetch('{% url "enviar_mensagem_cliente" %}', {
        method: 'POST',
        body: formData
    })
    .then(response => response.json())
    .then(data => {
        if (data.status === 'sucesso') {
            document.querySelector('textarea').value = '';
            location.reload();
        }
    });
});
</script>
{% endblock %}
