<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Oficina Miadas AI</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#f2f4f8;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.chat-box{
    width:420px;
    height:650px;
    background:#fff;
    border-radius:15px;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
    display:flex;
    flex-direction:column;
    overflow:hidden;
}

.header{
    background:#0d6efd;
    color:#fff;
    padding:15px;
    text-align:center;
    font-weight:bold;
}

.messages{
    flex:1;
    padding:15px;
    overflow-y:auto;
}

.msg{
    margin:10px 0;
    max-width:75%;
    padding:10px;
    border-radius:10px;
}

.user{
    background:#0d6efd;
    color:white;
    margin-left:auto;
}

.bot{
    background:#e9ecef;
}

.input-area{
    display:flex;
    border-top:1px solid #ddd;
}

input{
    flex:1;
    padding:12px;
    border:none;
    outline:none;
}

button{
    background:#0d6efd;
    color:white;
    border:none;
    padding:0 20px;
    cursor:pointer;
}
</style>

</head>

<body>

<div class="chat-box">

    <div class="header">🤖 Oficina Miadas AI</div>

    <div class="messages" id="messages">
        <div class="msg bot">Olá 👋 Como posso ajudar?</div>
    </div>

    <div class="input-area">
        <input type="text" id="msg">
        <button onclick="send()">Enviar</button>
    </div>

</div>

<script>
function send(){

    let input = document.getElementById("msg");
    let text = input.value;
    if(text === "") return;

    let box = document.getElementById("messages");

    box.innerHTML += `<div class="msg user">${text}</div>`;

    // loading
    box.innerHTML += `<div class="msg bot" id="loading">digitando...</div>`;
    box.scrollTop = box.scrollHeight;

    fetch("/chatbot/api/", {
        method:"POST",
        headers:{
            "Content-Type":"application/json",
            "X-CSRFToken":"{{ csrf_token }}"
        },
        body: JSON.stringify({mensagem:text})
    })
    .then(res => res.json())
    .then(data => {

        document.getElementById("loading").remove();

        box.innerHTML += `<div class="msg bot">${data.resposta}</div>`;
        box.scrollTop = box.scrollHeight;
    });

    input.value = "";
}
</script>

</body>
</html>
