{% load static %}
<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Login | Oficina Miadas</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Google Fonts: Poppins & Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Poppins:wght@300;500;700;800&display=swap" rel="stylesheet">
    
    <!-- Font Awesome para Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- AOS (Animate On Scroll) -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <!-- CSS Externo Unificado -->
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>
<body>

    <!-- Comentário: Background com vídeo -->
    <div class="auth-bg">
        <video autoplay muted loop playsinline>
            <source src="{% static 'videos/Video 5.mp4' %}" type="video/mp4">
        </video>
        <div class="auth-overlay"></div>
    </div>

    <!-- Comentário: Botão para voltar ao início -->
    <a href="/" class="back-home">
        <i class="fas fa-arrow-left"></i> Voltar ao Início
    </a>

    <!-- Comentário: Container principal do formulário -->
    <div class="auth-container" data-aos="zoom-in" data-aos-duration="800">
        <!-- Comentário: Logo da Oficina Miadas -->
        <div class="auth-logo">
            <img src="{% static 'images/logo.png' %}" alt="Logo Oficina Miadas">
        </div>
        
        <!-- Comentário: Títulos -->
        <h2>Bem-vindo!</h2>
        <p class="subtitle">Aceda à sua conta para gerir os seus agendamentos.</p>

        <!-- Comentário: Mensagens do Django -->
        {% if messages %}
            <ul class="messages">
                {% for message in messages %}
                    <li class="message {% if message.tags %}{{ message.tags }}{% endif %}">
                        <i class="fas fa-{% if message.tags == 'error' %}exclamation-circle{% else %}check-circle{% endif %}"></i>
                        {{ message }}
                    </li>
                {% endfor %}
            </ul>
        {% endif %}

        <!-- Comentário: Formulário de Login com validação -->
        <form method="POST" action="{% url 'login' %}" class="auth-form" id="formLogin" novalidate>
            {% csrf_token %}
            
            <!-- Comentário: Campo Nome de Utilizador -->
            <div class="form-group with-icon">
                <label for="id_username">
                    <i class="fas fa-user"></i> Nome de Utilizador
                </label>
                <input 
                    type="text" 
                    id="id_username" 
                    name="username" 
                    placeholder="Seu utilizador" 
                    required 
                    autofocus
                    class="form-input"
                    minlength="3"
                >
                <i class="fas fa-user input-icon"></i>
                <div class="validation-feedback"></div>
            </div>

            <!-- Comentário: Campo Palavra-passe -->
            <div class="form-group with-icon">
                <label for="id_password">
                    <i class="fas fa-lock"></i> Palavra-passe
                </label>
                <div class="password-wrapper">
                    <input 
                        type="password" 
                        id="id_password" 
                        name="password" 
                        placeholder="Sua senha" 
                        required
                        class="form-input"
                    >
                    <button type="button" class="toggle-password" onclick="togglePassword('id_password')">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
                <i class="fas fa-lock input-icon"></i>
                <div class="validation-feedback"></div>
            </div>

            <!-- Comentário: Checkbox "Lembrar-me" -->
            <div class="form-group checkbox">
                <input 
                    type="checkbox" 
                    id="id_remember" 
                    name="remember"
                >
                <label for="id_remember">Lembrar-me neste dispositivo</label>
            </div>

            <!-- Comentário: Botão de submissão -->
            <button type="submit" class="btn-submit" id="btnSubmit">
                Entrar <i class="fas fa-sign-in-alt"></i>
            </button>
        </form>

        <!-- Comentário: Links de rodapé -->
        <div class="auth-footer">
            <div class="footer-links">
                <a href="{% url 'password_reset' %}" class="link-password-reset">
                    <i class="fas fa-key"></i> Esqueceu a palavra-passe?
                </a>
            </div>
            <div class="footer-signup">
                Não tem conta? <a href="{% url 'cadastro' %}">Cadastre-se aqui</a>
            </div>
        </div>
    </div>

    <!-- Comentário: Scripts de animação e validação -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="{% static 'js/logins.js' %}"></script>
    <script>
        AOS.init({ once: true });
    </script>
</body>
</html>
